# Reference implementation of the governed CI lifecycle in
# docs/reference/ci-execution-policy.md. The repository-level Actions Policy is
# the primary actor/fork enforcement. The Action Policy job is an additional
# fail-closed check loaded from an immutable trusted revision.
#
# Placement (ENG-0269, 2026-09-14 amendment): this repository's own jobs run on
# the owner's persistent self-hosted Mac, pull-request events included. That is
# an accepted risk, not an oversight: the repository is private, so no fork can
# reach the runner, and the actor policy admits only the owner, dependabot, and
# the owner's registered agent Apps — identities that already execute on this
# machine, so a PR they open runs nothing here they cannot run locally. An
# ephemeral runner remains the recorded upgrade path; standard hosted runners
# remain the default for every other governed repository.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Runner placement (ENG-0269 amendment, 2026-09-14): every job in this
# repository runs on the owner's self-hosted runners — hosted minutes are
# metered on a private repository, so no job may fall back to a GitHub-hosted
# label. The Mac carries the general jobs (labels self-hosted/macOS/ARM64). The
# Windows shim job needs a self-hosted Windows runner; until one is registered
# and the repository variable CI_WINDOWS_RUNNER is set to `true`, that job is
# skipped and the gate accepts the skip. The CodeQL lane never runs while the
# repository is private, so its hosted default costs nothing. Reusable
# workflows called below are told the Mac labels through their `runs-on`
# input; their default stays `ubuntu-latest` so external consumers are
# unaffected.
jobs:
  policy:
    name: Action Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      run_full: ${{ steps.policy.outputs.run_full }}
      run_post_merge: ${{ steps.policy.outputs.run_post_merge }}
      pull_request_kind: ${{ steps.policy.outputs.pull_request_kind }}
      generated_release_projection: ${{ steps.policy.outputs.generated_release_projection }}
      governed_harness_projection: ${{ steps.policy.outputs.governed_harness_projection }}
      release_metadata_system: ${{ steps.policy.outputs.release_metadata_system }}
      source_input_policy: ${{ steps.policy.outputs.source_input_policy }}
      release_gate_mode: ${{ steps.policy.outputs.release_gate_mode }}
    steps:
      - id: policy
        uses: qwts/dev-steward/.github/actions/ci-policy@bed29090d8eaff29a75b983e94a50957c3ac9a42

  merge-evidence:
    name: Verify merged commit evidence
    needs: policy
    if: needs.policy.outputs.run_post_merge == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful complete-suite run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq 'any(.workflow_runs[]; .path == ".github/workflows/ci.yml" and (.event == "pull_request" or .event == "merge_group") and .conclusion == "success")')
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  preflight-evidence:
    name: Verify preflight evidence
    needs: policy
    if: github.event_name == 'pull_request' && needs.policy.outputs.run_full == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    outputs:
      validated: ${{ steps.evidence.outputs.validated }}
    steps:
      - id: evidence
        name: Find a successful manual complete-suite run for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$TARGET_SHA&per_page=100" \
            --jq 'first(.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .conclusion == "success") | .id) // empty')
          validated=false
          if [ -n "$run_id" ]; then
            validated=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq 'any(.jobs[]; .name == "CI" and .conclusion == "success")')
          fi
          echo "validated=$validated" >> "$GITHUB_OUTPUT"

  full:
    name: Complete suite
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    # ENG-0313 fan-out backpressure. Pull-request installs share one repo-wide
    # lane, so a `main` push that retargets every open PR queues its complete
    # suites instead of racing them into the package origins. Push, merge-group,
    # and dispatch runs carry exact-SHA evidence and take a unique per-run group
    # so they are never superseded by pull-request traffic.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-install-full' || format('ci-install-full-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        uses: ./.github/actions/bounded-dependency-install
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/ci-dependency-cache/npm
        with:
          ecosystem: npm
          cache-paths: ${{ runner.temp }}/ci-dependency-cache/npm
          lockfiles: package-lock.json
          toolchain-version: node-${{ steps.node.outputs.node-version }}
          task: Install locked dependencies
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'
      - name: Lint and configuration checks
        run: npm run lint:markdown && npm run lint:synced && npm run docs:gov && npm run repos:check && npm run ci-runtime:check && npm run pins:check
        env:
          GH_DRIFT_TOKEN: ${{ github.token }}
      - name: Unit and workflow-tooling tests
        run: npm test

  docs-gov:
    needs: [policy, merge-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      (needs.policy.outputs.run_full == 'true' ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    uses: ./.github/workflows/docs-governance.yml
    with:
      use-local-tooling: true
      runs-on: '["self-hosted", "macOS", "ARM64"]'

  dependency-inventory:
    needs: [policy, merge-evidence, preflight-evidence]
    if: >-
      always() && needs.policy.result == 'success' &&
      ((needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true') ||
      (needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated != 'true'))
    uses: ./.github/workflows/dependency-inventory.yml
    with:
      use-local-tooling: true
      fail-on-error: true
      runs-on: '["self-hosted", "macOS", "ARM64"]'

  bounded-command-windows:
    name: Bounded command / Windows npm
    needs: policy
    if: >-
      vars.CI_WINDOWS_RUNNER == 'true' &&
      (needs.policy.outputs.run_full == 'true' || needs.policy.outputs.run_post_merge == 'true')
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Launch npm command shim through the bounded runner
        uses: ./.github/actions/bounded-command
        with:
          task: Verify Windows npm command shim
          executable: npm.cmd
          arguments-json: '["--version"]'
          timeout-seconds: '30'

  codeql:
    needs: [policy, merge-evidence, preflight-evidence]
    # Code scanning needs GitHub Advanced Security, which a private repository
    # on a personal account cannot enable (#355). The lane is skipped there and
    # the gate below accepts the skip only while the repository is private.
    if: >-
      always() && needs.policy.result == 'success' &&
      github.event.repository.private == false &&
      (needs.policy.outputs.run_post_merge == 'true' ||
      (needs.policy.outputs.run_full == 'true' && needs.preflight-evidence.outputs.validated != 'true'))
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  post-merge:
    name: Post-merge smoke
    needs: [policy, merge-evidence]
    if: needs.policy.outputs.run_post_merge == 'true' && needs.merge-evidence.outputs.validated == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    # This lane runs only on a default-branch push and is the trusted cache
    # writer, so it takes the per-run group: seeding evidence is never dropped
    # because pull-request installs are busy.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'ci-install-post-merge' || format('ci-install-post-merge-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Seed trusted default-branch dependency cache
        uses: ./.github/actions/bounded-dependency-install
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/ci-dependency-cache/npm
        with:
          ecosystem: npm
          cache-paths: ${{ runner.temp }}/ci-dependency-cache/npm
          lockfiles: package-lock.json
          toolchain-version: node-${{ steps.node.outputs.node-version }}
          task: Seed trusted default-branch npm cache
          executable: npm
          arguments-json: '["ci"]'
          timeout-seconds: '300'
          attempts: '2'
          retry-delay-seconds: '5'
          termination-grace-seconds: '10'
      - name: Manifest and reconciler smoke
        run: node tools/repos/repos.mjs check && node --test tools/repos/tests/repos.test.mjs

  gate:
    name: CI
    needs: [policy, merge-evidence, preflight-evidence, full, docs-gov, dependency-inventory, bounded-command-windows, codeql, post-merge]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Enforce the selected lifecycle lane
        env:
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY: ${{ needs.policy.result }}
          FULL: ${{ needs.full.result }}
          DOCS_GOV: ${{ needs.docs-gov.result }}
          INVENTORY: ${{ needs.dependency-inventory.result }}
          BOUNDED_WINDOWS: ${{ needs.bounded-command-windows.result }}
          CODEQL: ${{ needs.codeql.result }}
          PREFLIGHT: ${{ needs.preflight-evidence.result }}
          PREFLIGHT_VALIDATED: ${{ needs.preflight-evidence.outputs.validated }}
          MERGE_VALIDATED: ${{ needs.merge-evidence.outputs.validated }}
          POST_MERGE: ${{ needs.post-merge.result }}
          PRIVATE: ${{ github.event.repository.private }}
          WINDOWS_RUNNER: ${{ vars.CI_WINDOWS_RUNNER }}
        run: |
          test "$POLICY" = success
          # The Windows shim job runs only on a registered self-hosted Windows
          # runner; without one it must have been skipped, never failed.
          if [ "$WINDOWS_RUNNER" = true ]; then
            test "$BOUNDED_WINDOWS" = success
          else
            test "$BOUNDED_WINDOWS" = skipped
          fi
          # A private repository has no code scanning (#355): the CodeQL lane
          # must have been skipped, never failed, and then counts as satisfied.
          if [ "$PRIVATE" = true ]; then
            test "$CODEQL" = skipped
            CODEQL=success
          fi
          case "$MODE" in
            full)
              if [ "$PREFLIGHT_VALIDATED" = true ]; then
                test "$PREFLIGHT" = success
              else
                test "$FULL" = success
                test "$DOCS_GOV" = success
                test "$INVENTORY" = success
                test "$CODEQL" = success
              fi
              ;;
            queue|manual)
              test "$FULL" = success
              test "$DOCS_GOV" = success
              test "$INVENTORY" = success
              test "$CODEQL" = success
              ;;
            post-merge)
              test "$CODEQL" = success
              if [ "$MERGE_VALIDATED" = true ]; then
                test "$POST_MERGE" = success
              else
                test "$FULL" = success
                test "$DOCS_GOV" = success
                test "$INVENTORY" = success
              fi
              ;;
            *) exit 1 ;;
          esac
